<!DOCTYPE html>
<html>
<head>
<style>
  .btn {
    width: 200px;
    height: 50px;
    border-radius: 64px;
    color: white;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 10px;
    background: linear-gradient(90deg, #042849 42.5%, #63CCB7 100%);
  }
  .btn1 { background: linear-gradient(110deg, #042849 42.5%, #63CCB7 100%); }
  .btn2 { background: linear-gradient(135deg, #042849 42.5%, #63CCB7 100%); }
  .btn3 { background: linear-gradient(160deg, #042849 42.5%, #63CCB7 100%); }
  .btn4 { background: linear-gradient(135deg, #042849 60%, #63CCB7 120%); }
</style>
</head>
<body style="background: black">
  <div class="btn btn1">110deg</div>
  <div class="btn btn2">135deg</div>
  <div class="btn btn3">160deg</div>
  <div class="btn btn4">135deg 60%</div>
</body>
</html>
